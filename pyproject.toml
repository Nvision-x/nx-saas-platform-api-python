[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nvisionx"
dynamic = ["version"]
description = "Python client for the NVISIONx Nx Platform API: ingest, search, agents and chat over your business records."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "NVISIONx" }]
keywords = ["nvisionx", "nx", "records", "search", "rag", "mcp", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "typing-extensions>=4.7",
]

[project.urls]
Homepage = "https://nx.dev"
Documentation = "https://nx.dev/docs"
Repository = "https://github.com/Nvision-x/nx-saas-platform-api-python"
Issues = "https://github.com/Nvision-x/nx-saas-platform-api-python/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.6",
    "mypy>=1.11",
    "datamodel-code-generator>=0.83",
    "pyyaml>=6",
]

[tool.hatch.version]
path = "src/nvisionx/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nvisionx"]

[tool.hatch.build.targets.sdist]
include = ["src/nvisionx", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/nvisionx/_models.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP007", "UP035", "RUF022"]

[tool.mypy]
strict = true
packages = ["nvisionx"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
