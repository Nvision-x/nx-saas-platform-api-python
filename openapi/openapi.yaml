          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ProcessMapUnavailable'
  /v1/search/compare:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    post:
      tags:
      - Search
      operationId: compareSearch
      summary: Compare search engines
      description: "Run one search on two search engines and get both rankings side by side, to evaluate search quality on\
        \ your\nown queries.\n\n- `baseline` is the current search engine, which answers this workspace's searches until the\
        \ workspace is\n  upgraded to the next-generation engine.\n- `candidate` is the next-generation search engine being\
        \ evaluated.\n\nOnce a workspace uses only the next-generation engine, it has no baseline: `baseline` is `unavailable`\n\
        (\"This workspace now uses only the next-generation search engine.\") and `candidate` answers.\n\nThe body is a `search`\
        \ body without `cursor`, checked the same way (modes, regex rules, `limit`). Each side's\n`results` are built exactly\
        \ as `search` builds them: one result per document, with the same ids, snippets,\nhighlights and scores, and limited\
        \ to the sources and access of your token (and to `sources`, when given).\nIn `regex` mode each side is one page (its\
        \ first `limit` documents). `overlap`, `only_baseline` and\n`only_candidate` compare the two sides by result `id`.\n\
        \nA side that fails or is too slow reports `error` (with empty `results`), and the other side's results are\nstill\
        \ returned: `timeout` (it did not answer within about 20 seconds, 45 in `regex` mode), `unavailable`\n(the engine\
        \ cannot answer for this workspace: the next-generation engine is not available for it, the\ncurrent engine is still\
        \ starting up, or the workspace now uses only the next-generation engine) or `failed`\n(anything else).\n\nThe call\
        \ always answers within about a minute. If neither engine's answer arrives in time, it is a `504`\n(`internal_error`,\
        \ `reason` `timeout`) and is not billed: try again shortly.\n\nBilled as one `search` call of the same mode (one query\
        \ on the `search` meter), whatever either side\nreturns. Budgets and rate limits apply as they do to `search`. A workspace\
        \ with nothing indexed yet is a 409\nand is not billed.\n"
      x-required-scope: search:compare
      x-meter: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCompareRequest'
            examples:
              hybrid:
                value:
                  query: indemnification cap in vendor contracts
                  mode: hybrid
                  limit: 10
              regex:
                value:
                  query: INV-\d{4,}
                  mode: regex
                  regex:
                    case_sensitive: true
                    fields:
                    - text
                    - filename
                  limit: 10
      responses:
        '200':
          description: Both rankings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCompareResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/BudgetExceeded'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          description: The search engines did not answer in time. Not billed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  type: internal_error
                  message: The search engines did not answer in time. Try again shortly.
                  reason: timeout
