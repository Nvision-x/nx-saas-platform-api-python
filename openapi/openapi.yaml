      - title
      - path
      - source_id
      - record_type
      - owner
      - sensitivity
      - score
      - snippet
      - retention
      properties:
        id:
          type: string
        title:
          type: string
        path:
          type: string
          description: Source URI.
        source_id:
          type: string
        record_type:
          type: string
        owner:
          type: string
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
        score:
          type: number
          minimum: 0
          maximum: 1
        snippet:
          type: string
        retention:
          $ref: '#/components/schemas/RecordRetention'
    SelectionPreview:
