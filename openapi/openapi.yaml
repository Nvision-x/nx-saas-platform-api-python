        account:
          type:
          - string
          - 'null'
          description: The verified tenant, bucket or domain, e.g. acmehealth.sharepoint.com.
        error:
          type:
          - string
          - 'null'
        expires_at:
          type: string
          format: date-time
          description: A pending authorization must be verified before this time.
    SourceAuthorizationCreate:
      type: object
      required:
      - provider
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
        mode:
          allOf:
          - $ref: '#/components/schemas/SourceMode'
          default: tenant
          description: Microsoft 365 only. Ignored by other providers.
        redirect_uri:
          type: string
          format: uri
          description: OAuth providers only.
    SourceAuthorizationVerify:
      type: object
      description: 'Pass the provider''s redirect parameters through unchanged.

        Microsoft 365 admin consent: `tenant`, `admin_consent`, `state` (or `error`, `error_description`).

        OAuth (`personal` mode, Google Drive, Box): `code`, `state`.

        IAM (Amazon S3): `bucket`, `region`, `role_arn`.

        '
      properties:
        code:
          type: string
          description: OAuth authorization code from the redirect.
        state:
          type: string
        tenant:
          type: string
          description: Microsoft 365 tenant ID from the admin-consent redirect.
        admin_consent:
          type: string
          examples:
          - 'True'
        error:
          type: string
        error_description:
          type: string
        bucket:
          type: string
          examples:
          - acme-claims-archive
        region:
          type: string
          examples:
          - us-east-1
        role_arn:
          type: string
          examples:
          - arn:aws:iam::123456789012:role/nx-reader
    SourceCreate:
      type: object
      required:
      - authorization_id
      - schedule
      properties:
        authorization_id:
          type: string
          description: A verified authorization.
        name:
          type: string
          description: 'Default: the verified account.'
        schedule:
          $ref: '#/components/schemas/SyncSchedule'
    SourceEstate:
      type: object
      required:
      - source_id
      - as_of
      - inventory
      - totals
      - by_type
      - by_age
      - top_containers
      properties:
        source_id:
          type: string
        as_of:
          type: string
          format: date-time
        inventory:
          type: object
          required:
          - status
          - containers_total
          - containers_done
          properties:
            status:
              type: string
              enum:
              - pending
              - running
              - complete
            containers_total:
              type: integer
            containers_done:
              type: integer
        totals:
          $ref: '#/components/schemas/EstateTotals'
        by_type:
          type: array
          items:
            $ref: '#/components/schemas/EstateBucket'
          description: 'Keys: documents, spreadsheets, presentations, pdf, email, images, media, archives, other.'
        by_age:
          type: array
          items:
            $ref: '#/components/schemas/EstateBucket'
          description: 'By last modified. Keys: lt_1y, 1y_3y, 3y_7y, gt_7y.'
        top_containers:
          type: array
          items:
            $ref: '#/components/schemas/SourceNode'
          description: Largest sites and drives.
    SourceList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Source'
    SourceMode:
      type: string
      enum:
      - tenant
      - personal
      description: '`tenant`: an administrator grants app-only read access to the whole organization (Microsoft 365). `personal`:
        delegated access to one user''s own drive.'
    SourceNode:
      type: object
      required:
      - ref
      - kind
      - name
      - path
      - has_children
      - selection
      properties:
        ref:
          type: string
          description: Opaque, stable node reference, e.g. `site:…`, `drive:…`, `item:…`. Use as `parent` and in selections.
          examples:
          - drive:b!x1
        kind:
          type: string
          enum:
          - group
          - site
          - library
          - onedrive
          - folder
          - file
          - bucket
          - prefix
        name:
          type: string
          examples:
          - Contracts
        path:
          type: string
          examples:
          - Legal / Contracts
        web_url:
          type:
          - string
          - 'null'
          format: uri
        has_children:
          type: boolean
        files:
          type:
          - integer
          - 'null'
          description: Recursive file count. `null` until inventoried.
        bytes:
          type:
          - integer
          - 'null'
          format: int64
        last_modified:
          type:
          - string
          - 'null'
          format: date-time
        selection:
          $ref: '#/components/schemas/NodeSelection'
    SourceNodeList:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SourceNode'
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    SourcePhase:
      type: string
      enum:
      - discovering
      - inventorying
      - awaiting_selection
      - syncing
      - idle
      description: 'Where the source is in its lifecycle. `awaiting_selection`: the estate is inventoried and nothing is selected
        yet.'
    SourceRun:
      type: object
      required:
      - id
      - kind
      - trigger
      - status
      - counters
      - started_at
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - discover
          - inventory
          - sync
          - reconcile
        trigger:
          type: string
          enum:
          - initial
          - schedule
          - webhook
          - manual
          - selection
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
        container:
          oneOf:
          - $ref: '#/components/schemas/SourceNode'
          - type: 'null'
        counters:
          type: object
          required:
          - seen
          - added
          - updated
          - deleted
          - bytes
          properties:
            seen:
              type: integer
            added:
              type: integer
            updated:
              type: integer
            deleted:
              type: integer
            bytes:
              type: integer
              format: int64
        error:
          type:
          - string
          - 'null'
        started_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
    SourceRunList:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SourceRun'
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    SourceSelection:
      allOf:
      - $ref: '#/components/schemas/SourceSelectionUpdate'
      - type: object
        required:
        - files
        - bytes
        - updated_at
        properties:
          files:
            type: integer
          bytes:
            type: integer
            format: int64
          updated_at:
            type:
            - string
            - 'null'
            format: date-time
    SourceSelectionUpdate:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - all
          - custom
        include:
          type: array
          items:
            type: string
          maxItems: 1000
          description: Node refs. `custom` only.
        exclude:
          type: array
          items:
            type: string
          maxItems: 1000
          description: 'Node refs inside included nodes (or anywhere with `mode: all`).'
        include_new_sites:
          type: boolean
          default: false
          description: 'Add sites and libraries created later. Implied by `mode: all`.'
        include_onedrive:
          type: boolean
          default: false
          description: 'Include every user''s OneDrive. Implied by `mode: all`.'
    SourceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        schedule:
          $ref: '#/components/schemas/SyncSchedule'
    SyncSchedule:
      type: string
      enum:
      - continuous
      - hourly
      - daily
      description: '`continuous`: change notifications from the provider, plus a safety-net poll. `hourly` and `daily`: incremental
        syncs on that cadence. Use `syncSource` to sync now.'
    TokenUsage:
      type: object
      description: The language-model tokens an answer used, billed on the `llm_input` and `llm_output` meters.
      required:
      - input_tokens
      - output_tokens
      properties:
        input_tokens:
          type: integer
          description: Tokens the models read (prompts and retrieved text, cached reads included).
        output_tokens:
          type: integer
          description: Tokens the models wrote.
    Usage:
      type: object
      required:
      - period
      - period_start
      - period_end
      - days_elapsed
      - total_usd
      - forecast_usd
      - meters
      - daily_spend_usd
      - credit
      properties:
        period:
          type: string
          examples:
          - 2026-10
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        days_elapsed:
          type: integer
        total_usd:
          type: number
        forecast_usd:
          type: number
          description: At the current run rate.
        meters:
          type: array
          items:
            $ref: '#/components/schemas/MeterUsage'
        daily_spend_usd:
          type: array
          items:
            type: number
        next_invoice_at:
          type: string
          format: date
        credit:
          $ref: '#/components/schemas/UsageCredit'
    UsageCredit:
      type: object
      required:
      - organization_total_usd
      - applied_usd
      - remaining_usd
      description: Free credit against the period's usage. Credit belongs to the **organization**, so these figures cover
        every workspace of it, not only the workspace of the request. Provisional until the period closes.
      properties:
        organization_total_usd:
          type: number
          description: The organization's usage cost for the period (every workspace).
        applied_usd:
          type: number
          description: Credit applied to the organization's usage in the period (at most `organization_total_usd`).
        remaining_usd:
          type: number
          description: Unexpired credit left after the period.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: nx_live_… | nx_test_…
      description: Workspace-bound API token. Create one under API tokens; the secret is shown once.
