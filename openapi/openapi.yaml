    get:
      tags:
      - Process map
      operationId: searchProcessEntities
      summary: Search registered entities
      description: Registered entities whose name or alias contains `query`, ordered by name. An empty query lists every entity.
        A cursor from another index build answers `409` with reason `stale_cursor`.
      x-required-permission: ingest_search:view
      x-required-scope: ingest:read
      parameters:
      - name: query
        in: query
        schema:
          type: string
          maxLength: 200
          default: ''
      - name: kind
        in: query
        schema:
          type: string
          maxLength: 64
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessEntityPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ProcessMapUnavailable'
