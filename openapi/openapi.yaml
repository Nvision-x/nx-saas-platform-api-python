      required:
      - id
      - provider
      - mode
      - name
      - detail
      - schedule
      - status
      - phase
      - progress
      - documents
      - size_gb
      - selection_summary
      - estate_summary
      - created_at
      properties:
        id:
          type: string
          examples:
          - src_01J9Z…
        provider:
          $ref: '#/components/schemas/Provider'
        mode:
          $ref: '#/components/schemas/SourceMode'
        name:
          type: string
          examples:
          - acmehealth.sharepoint.com
        account:
          type:
          - string
          - 'null'
