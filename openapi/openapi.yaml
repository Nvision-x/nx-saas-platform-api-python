  /v1/chat/conversations/{conversation_id}/messages:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - name: conversation_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Chat
      operationId: sendChatMessage
      summary: Ask a question
      description: 'Adds the question to the conversation and answers it with a hosted agent that searches

        the conversation''s sources (all the credential may read when it names none). The answer

        cites records with `[n]` markers that match `citations[].marker`. Billed by the

        language-model tokens the answer used (`usage`), like agent runs.


        With `Accept: text/event-stream` the answer streams as server-sent events, each a JSON

        `ChatStreamEvent` in `data:`: `status` and `step` events while the agent works, `delta`

        events with answer text, then one `complete` event carrying the stored assistant

        message (or one `error` event). Otherwise the response is the assistant message as JSON.

        '
      x-required-scope: agent:write
      x-meter:
      - llm_input
      - llm_output
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageCreate'
            example:
              content: Which vendor contracts cap indemnity below $2M?
      responses:
        '200':
          description: The assistant's answer, or a stream of events ending with it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatStreamEvent'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '402':
          $ref: '#/components/responses/BudgetExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/billing/usage:
