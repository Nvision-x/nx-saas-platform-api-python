openapi: 3.1.0
info:
  title: Nx Platform API
  version: 2026-10-01
  summary: Business context, as an API.
servers:
- url: https://platform.us.nvisionx.ai
  description: Production
security:
- bearerAuth: []
paths:
  /v1/models:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    get:
      tags:
      - Models
      operationId: listModels
      summary: List the language models
      description: The supported models with what this organization pays for each and whether the workspace may use them,
        in the workspace's order of preference (allowed models first). Deprecated models still answer but should be moved
        off.
      x-required-scope: agent:read
      responses:
        '200':
          description: Models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
  /v1/sources/authorizations:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    post:
      tags:
      - Data sources
      operationId: createSourceAuthorization
      summary: Start authorizing a data source
      description: "Step 1 of connecting a source.\n\n- **SharePoint / OneDrive, `mode: tenant`** (default) returns an admin-consent\n\
        \  `authorize_url`. A Microsoft 365 administrator grants Nx read-only, app-only\n  access to the whole tenant; Microsoft\
        \ redirects to `redirect_uri` with `tenant`,\n  `admin_consent` and `state`, which you pass to the verify call.\n\
        - **`mode: personal`** (SharePoint / OneDrive, Google Drive, Box) returns a\n  delegated `authorize_url` for the signed-in\
        \ user's own drive; the provider\n  redirects with a `code`.\n- **IAM providers** (Amazon S3) return `external_id`.\
        \ Create an IAM role Nx can\n  assume with that external ID, granting `s3:GetObject` and `s3:ListBucket` only,\n \
        \ then pass the bucket and role ARN to the verify call.\n"
      x-required-scope: sources:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceAuthorizationCreate'
      responses:
        '201':
          description: Pending authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAuthorization'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /v1/sources/authorizations/{authorization_id}:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - name: authorization_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Data sources
      operationId: getSourceAuthorization
      summary: Get an authorization
      x-required-scope: sources:read
      responses:
        '200':
          description: Authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAuthorization'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sources/authorizations/{authorization_id}/verify:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - name: authorization_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Data sources
      operationId: verifySourceAuthorization
      summary: Complete and verify an authorization
      description: Verifies read-only access and records the account (tenant, bucket or domain). Connectors are read-only
        today. Browse and select content on the source once it is created.
      x-required-scope: sources:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceAuthorizationVerify'
      responses:
        '200':
          description: Verified authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceAuthorization'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '422':
          description: The provider rejected the credentials or the role cannot be assumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    get:
      tags:
      - Data sources
      operationId: listSources
      summary: List data sources
      x-required-scope: sources:read
      responses:
        '200':
          description: Connected sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'
    post:
      tags:
      - Data sources
      operationId: createSource
      summary: Connect a data source
      description: 'Step 2 of connecting a source. Nx discovers the data estate (sites, libraries,

        drives) and inventories its metadata; no documents are ingested until you choose

        content with `updateSourceSelection`. The source moves through `phase`

        `discovering` → `inventorying` → `awaiting_selection`. Ingestion is metered as

        documents ingested and GB processed.

        '
      x-required-scope: sources:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreate'
      responses:
        '201':
          description: Source connected; discovery running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '402':
          $ref: '#/components/responses/BudgetExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sources/{source_id}:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - $ref: '#/components/parameters/SourceId'
    get:
      tags:
      - Data sources
      operationId: getSource
      summary: Get a data source
      x-required-scope: sources:read
      responses:
        '200':
          description: Source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Data sources
      operationId: updateSource
      summary: Rename a source or change its schedule
      x-required-scope: sources:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
      responses:
        '200':
          description: Updated source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Data sources
      operationId: deleteSource
      summary: Disconnect a data source
      description: Stops syncing and revokes Nx's access. The source's documents are removed from the workspace.
      x-required-scope: sources:write
      responses:
        '200':
          description: Disconnected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sources/{source_id}/sync:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - $ref: '#/components/parameters/SourceId'
    post:
      tags:
      - Data sources
      operationId: syncSource
      summary: Sync now
      x-required-scope: sources:write
      responses:
        '202':
          description: Sync started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '402':
          $ref: '#/components/responses/BudgetExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sources/{source_id}/estate:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - $ref: '#/components/parameters/SourceId'
    get:
      tags:
      - Data sources
      operationId: getSourceEstate
      summary: Summarize the data estate
      description: Totals and breakdowns of everything Nx can read in the source — selected or not — from the metadata inventory.
        Partial while `inventory.status` is `running`.
      x-required-scope: sources:read
      responses:
        '200':
          description: Estate summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceEstate'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sources/{source_id}/nodes:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - $ref: '#/components/parameters/SourceId'
    get:
      tags:
      - Data sources
      operationId: listSourceNodes
      summary: Browse a source
      description: 'Children of `parent` in the source''s tree, for interactive browsing. Omit `parent`

        for the top level (for Microsoft 365: `SharePoint sites` and `OneDrive`). Then

        sites → libraries → folders. Each node carries its recursive file count, size and

        its state in the current selection. Pass `q` to search names under `parent`.

        '
      x-required-scope: sources:read
      parameters:
      - name: parent
        in: query
        description: A node `ref`. Omit for the top level.
        schema:
          type: string
      - name: q
        in: query
        description: Name search under `parent`.
        schema:
          type: string
      - name: files
        in: query
        description: Include files as well as containers and folders.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Child nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceNodeList'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sources/{source_id}/selection:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - $ref: '#/components/parameters/SourceId'
    get:
      tags:
      - Data sources
      operationId: getSourceSelection
      summary: Get the selected content
      x-required-scope: sources:read
      responses:
        '200':
          description: Selection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSelection'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Data sources
      operationId: updateSourceSelection
      summary: Choose what to ingest
      description: 'Replace the selection. `mode: all` ingests everything Nx can read; `mode: custom`

        ingests the nodes in `include` minus those in `exclude` (the nearest rule to a file

        wins). Newly included documents are ingested and newly excluded ones are removed

        from the workspace, without re-reading the source.

        '
      x-required-scope: sources:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceSelectionUpdate'
            example:
              mode: custom
              include:
              - drive:b!x1
              - item:b!x2:01ABC
              exclude:
              - item:b!x2:01DEF
              include_new_sites: false
              include_onedrive: false
      responses:
        '200':
          description: Saved selection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSelection'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '402':
          $ref: '#/components/responses/BudgetExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/sources/{source_id}/selection/preview:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - $ref: '#/components/parameters/SourceId'
    post:
      tags:
      - Data sources
      operationId: previewSourceSelection
      summary: Preview a selection
      description: Files and bytes a selection would ingest, without saving it.
      x-required-scope: sources:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceSelectionUpdate'
      responses:
        '200':
          description: Preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectionPreview'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/sources/{source_id}/runs:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - $ref: '#/components/parameters/SourceId'
    get:
      tags:
      - Data sources
      operationId: listSourceRuns
      summary: List sync runs
      description: Discovery, inventory and sync runs, newest first.
      x-required-scope: sources:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRunList'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sources/{source_id}/app-grants:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - $ref: '#/components/parameters/SourceId'
    get:
      tags:
      - Data sources
      operationId: listSourceAppGrants
      summary: List sync capacity
      description: 'Microsoft 365 throttles each application per tenant. Large tenants consent to more

        than one Nx application; Nx spreads drives across them. `recommended` is the number

        of applications Nx suggests for this estate. Tenant-mode Microsoft 365 sources only.

        '
      x-required-scope: sources:read
      responses:
        '200':
          description: App grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppGrantList'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Data sources
      operationId: createSourceAppGrant
      summary: Add sync capacity
      description: Returns a pending grant whose `consent_url` a tenant administrator opens to consent to the next Nx application.
        Consent completes through `verifySourceAuthorization`-style redirect parameters on `verifySourceAppGrant`.
      x-required-scope: sources:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - redirect_uri
              properties:
                redirect_uri:
                  type: string
                  format: uri
      responses:
        '201':
          description: Pending grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppGrant'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The source is not a tenant-mode Microsoft 365 source, or every Nx application is already granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sources/{source_id}/app-grants/{grant_id}/verify:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - $ref: '#/components/parameters/SourceId'
    - name: grant_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Data sources
      operationId: verifySourceAppGrant
      summary: Complete added capacity
      x-required-scope: sources:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceAuthorizationVerify'
      responses:
        '200':
          description: Consented grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppGrant'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Consent was declined or granted for a different tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/documents:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    get:
      tags:
      - Data
      operationId: listDocuments
      summary: List documents
      description: The workspace's documents, newest first, limited to the sources your token can read.
      x-required-permission: ingest_search:view
      x-required-scope: ingest:read
      parameters:
      - name: status
        in: query
        description: '`active` (default), `deleted` or `all`.'
        schema:
          $ref: '#/components/schemas/DocumentStatusFilter'
      - name: source_id
        in: query
        schema:
          type: string
      - name: q
        in: query
        description: Matches the name or path, case-insensitively.
        schema:
          type: string
          maxLength: 200
      - name: modified_after
        in: query
        schema:
          type: string
          format: date-time
      - name: modified_before
        in: query
        schema:
          type: string
          format: date-time
      - name: stage
        in: query
        description: Only live documents at this stage of the pipeline.
        schema:
          $ref: '#/components/schemas/DocumentStage'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Documents, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Ingest
      operationId: ingestDocuments
      summary: Ingest documents
      description: 'Upload files or a URL into the workspace. Each document is classified as a

        business record — type, owner, sensitivity, retention — before it becomes

        searchable. Accepts PDF, DOCX, XLSX, MSG, EML, TXT and images: up to 100 files

        per request, up to 2 GB each. More than 100 files is `400` and nothing of the

        request is kept; split larger batches into several requests.


        Send an `Idempotency-Key` to retry safely: a retry with the same key within

        24 h returns the original `202` (same job, marked `Idempotent-Replayed: true`)

        without reading the body, storing the files again or billing them again. Only

        a successful response is kept, so a request that failed can be retried with

        the same key.


        For a governing-document upload, send the multipart `metadata` part before

        every `file` part. Its JSON object of strings pairs `governing_doc_type`

        (an uploadable registry id) with `governing_doc_source: manual`. Optional

        `governing_doc_version` (up to 64 characters), `governing_doc_effective_from`

        and `governing_doc_effective_to` (`YYYY-MM-DD`, ordered from earliest to

        latest) are recorded as supplied values. Each file creates a confirmed,

        uploaded governing document without classification, even with discovery

        off. Other metadata keys without the `governing_doc_` prefix are stored

        with the record as usual. Invalid governing metadata rejects the request

        and removes any originals already stored for it.

        '
      x-required-scope: ingest:write
      x-meter: docs
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestUrlRequest'
            example:
              url: https://files.acmehealth.io/Northwind_MSA_2024.pdf
              metadata:
                department: legal
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IngestUploadRequest'
      responses:
        '202':
          description: Ingestion job queued.
          headers:
            Idempotent-Replayed:
              description: '`true` when this is the response saved under the request''s Idempotency-Key, not a new job.'
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '402':
          $ref: '#/components/responses/BudgetExceeded'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: A file exceeds 2 GB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Invalid governing upload metadata. `error.reason` is

            `governing_metadata_incomplete` when type and source are not both

            present or both absent; `governing_source_invalid` when source is not

            `manual`; `governing_type_invalid` for an unknown registry id;

            `governing_type_not_uploadable` for a type that cannot be uploaded; or

            `governing_field_invalid` for an invalid date, reversed date interval

            or version longer than 64 characters. No uploaded originals are kept.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The governing type registry could not be obtained (`error.reason` is `governing_types_unavailable`).
            No uploaded originals are kept; retry when the registry is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/documents/summary:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    get:
      tags:
      - Data
      operationId: getDocumentSummary
      summary: Summarize the workspace's documents
      description: Documents and bytes per source, live and deleted, and how long deleted documents' data is kept.
      x-required-permission: ingest_search:view
      x-required-scope: ingest:read
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/documents/delete:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    post:
      tags:
      - Data
      operationId: deleteDocuments
      summary: Delete documents
      description: 'Deletes up to 200 documents by id, or every live document matching a filter. A filter delete must send

        `expected_count`, the `matched` of a `dry_run` with the same filter: when the documents matching it changed

        since, nothing is deleted and the answer is 409. A filter deletes at most 10,000 documents at a time (400

        beyond). A deleted document leaves search, and its original and

        parsed text are removed from the workspace''s bucket after the workspace''s `deleted_retention_days`; its

        record and history are kept. A document from a connector is also excluded from its source''s selection so a

        sync does not bring it back; removing that exclusion restores it.

        '
      x-required-permission: ingest_search:full
      x-required-scope: ingest:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentDeleteRequest'
            example:
              filter:
                source_id: src_01J8Z
                modified_before: '2023-01-01T00:00:00Z'
              dry_run: true
      responses:
        '200':
          description: What was (or with `dry_run` would be) deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDeleteResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/documents/reparse:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    post:
      tags:
      - Data
      operationId: reparseDocuments
      summary: Re-parse failed documents
      description: 'Reads failed documents again from their stored originals, so a parser fix reaches documents that failed

        before it without uploading them again. Takes up to 200 document ids, or a filter that matches failed live

        documents only (its `stage` is ignored). Ids of documents that are not failed are skipped. A filter must

        send `expected_count`, which is the `matched` of a `dry_run` with the same filter. When the matching

        documents have changed since then, nothing is queued and the answer is 409. A filter re-parses at most

        10,000 documents at a time; more than that is a 400. Queued documents are `parsing` until the parser

        finishes. A document that fails again keeps its new reason.

        '
      x-required-permission: ingest_search:full
      x-required-scope: ingest:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentReparseRequest'
            example:
              filter:
                source_id: src_01J8Z
              dry_run: true
      responses:
        '200':
          description: What was (or with `dry_run` would be) queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentReparseResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: Re-parsing is not available in this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/documents/{document_id}/parsed:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - name: document_id
      in: path
      required: true
      schema:
        type: string
        examples:
        - doc_01J8Z
    get:
      tags:
      - Data
      operationId: getParsedDocument
      summary: Get what the parser read from a document
      description: The parsed text and what the parser found. 404 while the document is not parsed yet, when it could not
        be parsed, or once a deleted document's data is removed.
      x-required-permission: ingest_search:view
      x-required-scope: ingest:read
      responses:
        '200':
          description: Parsed output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentParsed'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The workspace's storage is not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/documents/{document_id}:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - name: document_id
      in: path
      required: true
      schema:
        type: string
        examples:
        - doc_01J8Z
    get:
      tags:
      - Data
      operationId: getDocument
      summary: Get a document
      description: A document with its history, oldest event first.
      x-required-permission: ingest_search:view
      x-required-scope: ingest:read
      responses:
        '200':
          description: Document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Data
      operationId: deleteDocument
      summary: Delete a document
      description: Deletes one document, as `deleteDocuments` does. Deleting a deleted document changes nothing.
      x-required-permission: ingest_search:full
      x-required-scope: ingest:write
      responses:
        '202':
          description: Deleted; its data is removed after the workspace's deleted_retention_days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/jobs:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    get:
      tags:
      - Ingest
      operationId: listJobs
      summary: List ingestion jobs
      x-required-scope: ingest:read
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/JobStatus'
      - name: source_id
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Jobs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
  /v1/jobs/summary:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    get:
      tags:
      - Ingest
      operationId: getJobSummary
      summary: Summarize ingestion
      description: 'Jobs by status, the documents still in the pipeline, and how many documents were added, parsed and made

        searchable in each of the last 24 hours. Limited to the sources your token can read.


        `indexing` and `search_upgrade` report work on the whole workspace (not limited to your sources): an update

        of the search index, and an upgrade of the workspace''s search. Each is `null` when none ran in the last

        24 hours. While one is `running`, new documents may not be searchable yet (`indexing`) or some results may be

        incomplete (`search_upgrade`). Progress is reported about every 30 seconds.

        '
      x-required-scope: ingest:read
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSummary'
  /v1/jobs/{job_id}:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - name: job_id
      in: path
      required: true
      schema:
        type: string
        examples:
        - job_7Hq2xK
    get:
      tags:
      - Ingest
      operationId: getJob
      summary: Get job status
      description: Poll an ingestion job. Completed jobs return the record types assigned to each document in `classified`.
      x-required-scope: ingest:read
      responses:
        '200':
          description: Job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/search:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    post:
      tags:
      - Search
      operationId: search
      summary: Search records
      description: 'Search across the workspace, limited to the sources your token can read, in one of four modes: `hybrid`
        (the default), `semantic`, `keyword` or `regex`. Results carry business context, not just text matches. A `regex`
        pattern RE2 cannot compile, or one that matches empty text, is a 400 on `query` saying why. Results come in pages
        of documents in every mode, one result a document: `total` counts the documents available over all pages, and `next_cursor`
        fetches the next `limit` of them. Each page runs the search again, so documents changed between pages may move.'
      x-required-scope: search:read
      x-meter: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              hybrid:
                value:
                  query: indemnification cap in vendor contracts
                  mode: hybrid
                  limit: 5
              regex:
                value:
                  query: INV-\d{4,}
                  mode: regex
                  regex:
                    case_sensitive: true
                    fields:
                    - text
                    - filename
                  limit: 10
      responses:
        '200':
          description: Ranked results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/BudgetExceeded'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/process-map/status:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    get:
      tags:
      - Process map
      operationId: getProcessMapStatus
      summary: Get Process Map availability
      description: Whether Process Map can be used in this workspace and which parts are available. Never calls a language
        model.
      x-required-permission: ingest_search:view
      x-required-scope: ingest:read
      responses:
        '200':
          description: Availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessMapStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
