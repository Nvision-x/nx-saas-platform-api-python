      - name: governing_document_id
        in: query
        schema:
          type: string
          maxLength: 64
  /v1/process-map/entities/{entity_id}/assessments:
    parameters:
    - $ref: '#/components/parameters/WorkspaceHeader'
    - $ref: '#/components/parameters/ProcessEntityId'
    get:
      tags:
      - Process map
      operationId: listProcessAssessments
      summary: List assessments
      description: Assessments of this entity against one policy version, newest first, including failed and cancelled ones.
        Only assessments made with your current access are listed. `current` marks those whose input still matches.
      x-required-permission: ingest_search:view
      x-required-scope: ingest:read
      parameters:
      - name: policy_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 64
      - name: version
        in: query
        required: true
        schema:
          type: string
          maxLength: 64
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: policy_source
        in: query
        schema:
          type: string
          enum:
          - catalog
          - workspace_document
          default: catalog
      - name: governing_document_id
        in: query
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: Assessments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessAssessmentPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ProcessMapUnavailable'
    post:
      tags:
      - Process map
      operationId: startProcessAssessment
      summary: Start an assessment
      description: Assesses the evidence set identified by `snapshot_id` against the policy. `409` with reason `stale_input`
        when the input changed since you saw it (`current` holds the new identity); `422` with reason `policy_not_applicable`.
        An identical assessment already queued or running is returned with `200` instead of starting another.
      x-required-permission: ingest_search:edit
      x-required-scope: ingest:write
      x-meter:
      - llm_input
      - llm_output
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessAssessmentStart'
      responses:
        '200':
          description: An identical assessment is already queued or running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessAssessment'
        '202':
          description: Queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessAssessment'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/BudgetExceeded'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProcessMapUnavailable'
  /v1/process-map/assessments/{assessment_id}:
