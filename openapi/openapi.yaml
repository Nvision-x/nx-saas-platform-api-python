          type: integer
        usage:
          $ref: '#/components/schemas/TokenUsage'
        model:
          type:
          - string
          - 'null'
          description: The model that wrote the answer (its name).
        notices:
          type: array
          items:
            $ref: '#/components/schemas/ChatNotice'
          description: What the user should know about how the answer was produced, in order (empty when nothing happened).
        cost_usd:
          type: number
          description: 'What the answer cost: its tokens (tool calls are not billed on their own).'
        duration_ms:
          type:
          - integer
          - 'null'
          description: How long the answer took, in milliseconds. `null` on answers stored before it was recorded.
        created_at:
          type: string
          format: date-time
    ChatMessageCreate:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8000
    ChatNotice:
      type: object
      description: 'Something about how an answer was produced that the user should be told. `capacity_wait`: our service
        hit a capacity limit with its AI model provider and the answer waited before retrying. `fallback`: the answer used
        a different model than usual because the first choice was unavailable. `degraded`: no model could write the answer
        (a capacity limit, or the provider unavailable), so it lists the most relevant passages instead.'
      required:
      - kind
      - message
      properties:
        kind:
          type: string
          enum:
          - capacity_wait
          - fallback
          - degraded
        message:
          type: string
          description: To show the user as is.
        attempt:
          type:
          - integer
          - 'null'
          description: '`capacity_wait`: which retry this was.'
        of:
          type:
          - integer
          - 'null'
          description: '`capacity_wait`: how many retries there are at most.'
        wait_s:
          type:
          - integer
          - 'null'
          description: '`capacity_wait`: seconds waited before the retry.'
    ChatReasoningStep:
      type: object
      required:
      - summary
      description: One step of how an answer was made, in order. Messages stored before steps were timed have only `summary`
        (and `tool`).
      properties:
        summary:
          type: string
          examples:
          - 'Pass 2: searched 3 new queries, 12 new passages'
        detail:
          type:
          - string
          - 'null'
        tool:
          oneOf:
          - $ref: '#/components/schemas/McpToolName'
          - type: 'null'
          description: 'The tool the step called: `search_records` for a search, `get_record` for reading a whole record.
            `null` for understanding the question and writing the answer.'
        kind:
          type: string
          enum:
          - route
          - search
          - read
          - answer
          description: '`route`: understanding the question · `search`: one search pass · `read`: reading a whole record ·
            `answer`: writing and checking the answer after the last tool call.'
        at_ms:
          type: integer
          description: When the step started, in milliseconds from the start of the answer.
        duration_ms:
          type: integer
          description: How long the step took, in milliseconds.
        queries:
          type: array
          items:
            type: string
          description: The searches a `search` step ran, as plain text.
    ChatStreamEvent:
      type: object
      required:
      - type
      description: 'One server-sent event of `sendChatMessage`. `status`: what the agent is doing now · `step`: a finished
        reasoning step · `notice`: something the user should be told now, such as our service hitting a capacity limit with
        its AI model provider and waiting to retry · `delta`: answer text to append · `complete`: the stored assistant message
        · `error`: the answer failed (nothing is billed for an answer that never started).'
      properties:
        type:
          type: string
          enum:
          - status
          - step
          - notice
          - delta
          - complete
          - error
        status:
          type: string
        step:
          $ref: '#/components/schemas/ChatReasoningStep'
        notice:
          $ref: '#/components/schemas/ChatNotice'
        text:
          type: string
        message:
          $ref: '#/components/schemas/ChatMessage'
        error:
          type: string
        code:
          type: string
          enum:
          - capacity
          description: 'On `error`, why when it is known: `capacity` means our service hit a capacity limit with its AI model
            provider; trying again in a minute usually works.'
    Classification:
