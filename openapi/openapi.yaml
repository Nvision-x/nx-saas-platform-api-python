      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - timeout
          - unavailable
          - failed
          description: '`timeout`: the engine did not answer in time · `unavailable`: the engine cannot answer for this workspace
            right now (the next-generation engine is not available for it, or the current engine is still starting up) · `failed`:
            anything else.'
        message:
          type: string
    SearchCompareRequest:
      type: object
      required:
      - query
      description: A `SearchRequest` without `cursor`, checked the same way.
      properties:
        query:
          type: string
          minLength: 1
          description: Natural-language or keyword query. In `regex` mode, an RE2 regular expression of at most 1,000 characters
            (no backreferences or lookaround).
        sources:
          type: array
          items:
            type: string
          description: 'Limit to these source IDs. Default: every source the token can read.'
        mode:
          type: string
          enum:
          - hybrid
          - semantic
          - keyword
          - regex
          default: hybrid
          description: As in `SearchRequest`. Both sides run the same mode.
        regex:
          $ref: '#/components/schemas/RegexOptions'
        filters:
          type: object
          properties:
            record_type:
              type: array
              items:
                type: string
            owner:
              type: string
            sensitivity:
              type: array
              items:
                $ref: '#/components/schemas/Sensitivity'
            retention_status:
              $ref: '#/components/schemas/RetentionStatus'
            created_after:
              type: string
              format: date
            created_before:
              type: string
              format: date
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Results per side.
    SearchCompareResponse:
      type: object
      required:
      - query
      - mode
      - took_ms
      - baseline
      - candidate
      - overlap
      - only_baseline
      - only_candidate
      properties:
        query:
          type: string
        mode:
          type: string
          enum:
          - hybrid
          - semantic
          - keyword
          - regex
        took_ms:
          type: integer
          description: The whole comparison.
        cost_usd:
          type: number
          description: What the call cost (one `search` query).
        baseline:
          $ref: '#/components/schemas/SearchCompareSide'
        candidate:
          $ref: '#/components/schemas/SearchCompareSide'
        overlap:
          type: object
          required:
          - at_10
          - at_limit
          description: The share (0 to 1) of the baseline's first 10 (`at_10`) and first `limit` (`at_limit`) result ids that
            are also among the candidate's first 10 (or `limit`). `null` when either side has an `error`, or when neither
            side returned anything.
          properties:
            at_10:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 1
            at_limit:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 1
        only_baseline:
          type: array
          items:
            type: string
          description: The ids of the results only the baseline returned, in its order. Empty when either side has an `error`.
        only_candidate:
          type: array
          items:
            type: string
          description: The ids of the results only the candidate returned, in its order. Empty when either side has an `error`.
    SearchCompareSide:
      type: object
      required:
      - results
      - total
      - total_is_lower_bound
      - took_ms
      - error
      description: One search engine's answer.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
          description: As `search` returns them. Empty when `error` is set.
        total:
          type: integer
          description: 'Regex mode: every document the pattern matches. Other modes: the results returned.'
        total_is_lower_bound:
          type: boolean
          description: 'Regex mode: true when the engine stopped counting early, so there are at least `total` matching documents.
            False in the other modes.'
        took_ms:
          type: integer
          description: How long this engine took.
        error:
          oneOf:
          - $ref: '#/components/schemas/SearchCompareError'
          - type: 'null'
          description: Why this side has no results; `null` when it answered.
    SearchRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          description: Natural-language or keyword query. In `regex` mode, an RE2 regular expression of at most 1,000 characters
            (no backreferences or lookaround).
        sources:
          type: array
          items:
            type: string
          description: 'Limit to these source IDs. Default: every source the token can read.'
        mode:
          type: string
          enum:
          - hybrid
          - semantic
          - keyword
          - regex
          default: hybrid
          description: '`hybrid`: keyword and semantic results fused, then reranked · `semantic`: by meaning only (vector
            similarity) · `keyword`: by terms only (BM25) · `regex`: documents with a passage matching `query` as a regular
            expression, one result each (its passage with the most matches), most matches first. Every mode pages (`cursor`)
            and keeps to the sources and permissions of the token.'
        regex:
          $ref: '#/components/schemas/RegexOptions'
        cursor:
          type: string
          description: The `next_cursor` of the previous page, in any mode. Send the same `query`, `mode`, `regex`, `sources`,
            `filters` and `limit` as that page; a cursor from another search is a 400 on `cursor`. Each page runs the search
            again, so documents changed since the previous page may move.
        filters:
          type: object
          properties:
            record_type:
              type: array
              items:
                type: string
            owner:
              type: string
            sensitivity:
              type: array
              items:
                $ref: '#/components/schemas/Sensitivity'
            retention_status:
              $ref: '#/components/schemas/RetentionStatus'
            created_after:
              type: string
              format: date
            created_before:
              type: string
              format: date
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Documents per page, one result each, in every mode. A page is short only when it is the last.
    SearchResponse:
      type: object
      required:
      - took_ms
      - total
      - total_is_lower_bound
      - results
      properties:
        took_ms:
          type: integer
        total:
          type: integer
          description: 'The documents available over all pages (one result each), or a lower bound on them (`total_is_lower_bound`).
            Regex mode: every document the pattern matches. Other modes: the ranked documents the search can page through,
            at most 1,000 for `keyword` and `semantic` and 200 for `hybrid` (the pool it reranks). Other modes look one document
            past the page, so while more pages follow `total` is usually the documents so far plus one, a lower bound; it
            is exact once the ranking ends before the cap, and at the cap it is the cap, with no page past it.'
        total_is_lower_bound:
          type: boolean
          description: 'True when there may be more documents than `total`: in `hybrid`, `semantic` and `keyword` while more
            pages follow or at the cap; in `regex` when the engine stopped counting early.'
        cost_usd:
          type: number
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
          description: 'This page: one result a document (its best passage), best first. Ranks continue from the previous
            page, and a document is on one page only (unless it changed between pages).'
        next_cursor:
          type:
          - string
          - 'null'
          description: Send it as `cursor` for the next page, in any mode; `null` on the last page. Each page runs the search
            again and is billed as a search.
    SearchResult:
      type: object
      required:
      - id
      - title
      - path
      - source_id
      - record_type
      - owner
      - sensitivity
      - score
      - snippet
      - retention
      properties:
        id:
          type: string
        title:
          type: string
        path:
          type: string
          description: Source URI.
        source_id:
          type: string
        record_type:
          type: string
        owner:
          type: string
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
        score:
          type: number
          minimum: 0
          maximum: 1
        snippet:
          type: string
        retention:
          $ref: '#/components/schemas/RecordRetention'
        match_count:
          type: integer
          description: 'Regex mode: how many times the pattern matched in this result''s best passage, over the searched fields.'
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/SnippetRange'
          description: 'Regex mode: the parts of `snippet` that matched, as character offsets (Unicode code points). Empty
            in the other modes.'
    SelectionPreview:
      type: object
      required:
      - files
      - bytes
      - containers
      properties:
        files:
          type: integer
        bytes:
          type: integer
          format: int64
        containers:
          type: integer
          description: Sites, libraries and drives touched.
        complete:
          type: boolean
          description: False while the inventory is still running; counts will grow.
    Sensitivity:
      type: string
      enum:
      - public
      - internal
      - confidential
      - pii
      - phi
      - pci
    SnippetRange:
      type: object
      required:
      - start
      - end
      properties:
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
          description: Exclusive.
    Source:
      type: object
      required:
      - id
      - provider
      - mode
      - name
      - detail
      - schedule
      - status
      - phase
      - progress
      - documents
      - size_gb
      - selection_summary
      - estate_summary
      - created_at
      properties:
        id:
          type: string
          examples:
          - src_01J9Z…
        provider:
          $ref: '#/components/schemas/Provider'
        mode:
          $ref: '#/components/schemas/SourceMode'
        name:
          type: string
          examples:
          - acmehealth.sharepoint.com
        account:
          type:
          - string
          - 'null'
          description: The connected tenant, bucket or domain.
        detail:
          type: string
          examples:
          - 3 sites · Legal, HR, Finance
        schedule:
          $ref: '#/components/schemas/SyncSchedule'
        status:
          type: string
          enum:
          - healthy
          - syncing
          - paused
          - error
          - action_required
          description: '`action_required`: consent was revoked or change notifications are failing; see `error`.'
        phase:
          $ref: '#/components/schemas/SourcePhase'
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Progress of the current phase.
        documents:
          type: integer
          description: Documents ingested from this source.
        size_gb:
          type: number
          description: Size of the ingested documents.
        selection_summary:
          oneOf:
          - type: object
            required:
            - mode
            - files
            - bytes
            properties:
              mode:
                type: string
                enum:
                - all
                - custom
              files:
                type: integer
              bytes:
                type: integer
                format: int64
          - type: 'null'
          description: '`null` until content is selected.'
        estate_summary:
          oneOf:
          - $ref: '#/components/schemas/EstateTotals'
          - type: 'null'
          description: '`null` until discovery finishes.'
        last_synced_at:
          type:
          - string
          - 'null'
          format: date-time
        next_sync_at:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    SourceAuthorization:
      type: object
      required:
      - id
      - provider
      - mode
      - status
      properties:
        id:
          type: string
        provider:
          $ref: '#/components/schemas/Provider'
        mode:
          $ref: '#/components/schemas/SourceMode'
        status:
          type: string
          enum:
          - pending
          - verified
          - failed
        authorize_url:
          type:
          - string
          - 'null'
          format: uri
          description: OAuth and admin-consent providers.
        external_id:
          type:
          - string
          - 'null'
          description: IAM providers. Use as the role's sts:ExternalId condition.
        account:
          type:
          - string
          - 'null'
          description: The verified tenant, bucket or domain, e.g. acmehealth.sharepoint.com.
        error:
          type:
          - string
          - 'null'
        expires_at:
          type: string
          format: date-time
          description: A pending authorization must be verified before this time.
    SourceAuthorizationCreate:
      type: object
      required:
      - provider
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
        mode:
          allOf:
          - $ref: '#/components/schemas/SourceMode'
          default: tenant
          description: Microsoft 365 only. Ignored by other providers.
        redirect_uri:
          type: string
          format: uri
          description: OAuth providers only.
    SourceAuthorizationVerify:
      type: object
      description: 'Pass the provider''s redirect parameters through unchanged.

        Microsoft 365 admin consent: `tenant`, `admin_consent`, `state` (or `error`, `error_description`).

        OAuth (`personal` mode, Google Drive, Box): `code`, `state`.

        IAM (Amazon S3): `bucket`, `region`, `role_arn`.

        '
      properties:
        code:
          type: string
          description: OAuth authorization code from the redirect.
        state:
          type: string
        tenant:
          type: string
          description: Microsoft 365 tenant ID from the admin-consent redirect.
        admin_consent:
          type: string
          examples:
          - 'True'
        error:
          type: string
        error_description:
          type: string
        bucket:
          type: string
          examples:
          - acme-claims-archive
        region:
          type: string
          examples:
          - us-east-1
        role_arn:
          type: string
          examples:
          - arn:aws:iam::123456789012:role/nx-reader
    SourceCreate:
      type: object
      required:
      - authorization_id
      - schedule
      properties:
        authorization_id:
          type: string
          description: A verified authorization.
        name:
          type: string
          description: 'Default: the verified account.'
        schedule:
          $ref: '#/components/schemas/SyncSchedule'
    SourceEstate:
      type: object
      required:
      - source_id
      - as_of
      - inventory
      - totals
      - by_type
      - by_age
      - top_containers
      properties:
        source_id:
          type: string
        as_of:
          type: string
          format: date-time
        inventory:
          type: object
          required:
          - status
          - containers_total
          - containers_done
          properties:
            status:
              type: string
              enum:
              - pending
              - running
              - complete
            containers_total:
              type: integer
            containers_done:
              type: integer
        totals:
          $ref: '#/components/schemas/EstateTotals'
        by_type:
          type: array
          items:
            $ref: '#/components/schemas/EstateBucket'
          description: 'Keys: documents, spreadsheets, presentations, pdf, email, images, media, archives, other.'
        by_age:
          type: array
          items:
            $ref: '#/components/schemas/EstateBucket'
          description: 'By last modified. Keys: lt_1y, 1y_3y, 3y_7y, gt_7y.'
        top_containers:
          type: array
          items:
            $ref: '#/components/schemas/SourceNode'
          description: Largest sites and drives.
    SourceList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Source'
    SourceMode:
      type: string
      enum:
      - tenant
      - personal
      description: '`tenant`: an administrator grants app-only read access to the whole organization (Microsoft 365). `personal`:
        delegated access to one user''s own drive.'
    SourceNode:
      type: object
      required:
      - ref
      - kind
      - name
      - path
      - has_children
      - selection
      properties:
        ref:
          type: string
          description: Opaque, stable node reference, e.g. `site:…`, `drive:…`, `item:…`. Use as `parent` and in selections.
          examples:
          - drive:b!x1
        kind:
          type: string
          enum:
          - group
          - site
          - library
          - onedrive
          - folder
          - file
          - bucket
          - prefix
        name:
          type: string
          examples:
          - Contracts
        path:
          type: string
          examples:
          - Legal / Contracts
        web_url:
          type:
          - string
          - 'null'
          format: uri
        has_children:
          type: boolean
        files:
          type:
          - integer
          - 'null'
          description: Recursive file count. `null` until inventoried.
        bytes:
          type:
          - integer
          - 'null'
          format: int64
        last_modified:
          type:
          - string
          - 'null'
          format: date-time
        selection:
          $ref: '#/components/schemas/NodeSelection'
    SourceNodeList:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SourceNode'
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    SourcePhase:
      type: string
      enum:
      - discovering
      - inventorying
      - awaiting_selection
      - syncing
      - idle
      description: 'Where the source is in its lifecycle. `awaiting_selection`: the estate is inventoried and nothing is selected
        yet.'
    SourceRun:
      type: object
      required:
      - id
      - kind
      - trigger
      - status
      - counters
      - started_at
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - discover
          - inventory
          - sync
          - reconcile
        trigger:
          type: string
          enum:
          - initial
          - schedule
          - webhook
          - manual
          - selection
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
        container:
          oneOf:
          - $ref: '#/components/schemas/SourceNode'
          - type: 'null'
        counters:
          type: object
          required:
          - seen
          - added
          - updated
          - deleted
          - bytes
          properties:
            seen:
              type: integer
            added:
              type: integer
            updated:
              type: integer
            deleted:
              type: integer
            bytes:
              type: integer
              format: int64
        error:
          type:
          - string
          - 'null'
        started_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
    SourceRunList:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SourceRun'
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    SourceSelection:
      allOf:
      - $ref: '#/components/schemas/SourceSelectionUpdate'
      - type: object
        required:
        - files
        - bytes
        - updated_at
        properties:
          files:
            type: integer
          bytes:
            type: integer
            format: int64
          updated_at:
            type:
            - string
            - 'null'
            format: date-time
    SourceSelectionUpdate:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - all
          - custom
        include:
          type: array
          items:
            type: string
          maxItems: 1000
          description: Node refs. `custom` only.
        exclude:
          type: array
          items:
            type: string
          maxItems: 1000
          description: 'Node refs inside included nodes (or anywhere with `mode: all`).'
        include_new_sites:
          type: boolean
          default: false
          description: 'Add sites and libraries created later. Implied by `mode: all`.'
        include_onedrive:
          type: boolean
          default: false
          description: 'Include every user''s OneDrive. Implied by `mode: all`.'
    SourceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        schedule:
          $ref: '#/components/schemas/SyncSchedule'
    SyncSchedule:
      type: string
      enum:
      - continuous
      - hourly
      - daily
      description: '`continuous`: change notifications from the provider, plus a safety-net poll. `hourly` and `daily`: incremental
        syncs on that cadence. Use `syncSource` to sync now.'
    TokenUsage:
      type: object
      description: The language-model tokens an answer used, billed on the `llm_input` and `llm_output` meters.
      required:
      - input_tokens
      - output_tokens
      properties:
        input_tokens:
          type: integer
          description: Tokens the models read (prompts and retrieved text, cached reads included).
        output_tokens:
          type: integer
          description: Tokens the models wrote.
    Usage:
      type: object
      required:
      - period
      - period_start
      - period_end
      - days_elapsed
      - total_usd
      - forecast_usd
      - meters
      - daily_spend_usd
      - credit
      properties:
        period:
          type: string
          examples:
          - 2026-10
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        days_elapsed:
          type: integer
        total_usd:
          type: number
        forecast_usd:
          type: number
          description: At the current run rate.
        meters:
          type: array
          items:
            $ref: '#/components/schemas/MeterUsage'
        daily_spend_usd:
          type: array
          items:
            type: number
        next_invoice_at:
          type: string
          format: date
        credit:
          $ref: '#/components/schemas/UsageCredit'
    UsageCredit:
      type: object
      required:
      - organization_total_usd
      - applied_usd
      - remaining_usd
      description: Free credit against the period's usage. Credit belongs to the **organization**, so these figures cover
        every workspace of it, not only the workspace of the request. Provisional until the period closes.
      properties:
        organization_total_usd:
          type: number
          description: The organization's usage cost for the period (every workspace).
        applied_usd:
          type: number
          description: Credit applied to the organization's usage in the period (at most `organization_total_usd`).
        remaining_usd:
          type: number
          description: Unexpired credit left after the period.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: nx_live_… | nx_test_…
      description: Workspace-bound API token. Create one under API tokens; the secret is shown once.
