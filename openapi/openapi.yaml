          type: string
          description: Markdown. Assistant answers cite records with `[n]` markers.
        citations:
          type: array
          items:
            $ref: '#/components/schemas/ChatCitation'
        reasoning:
          type: array
          items:
            $ref: '#/components/schemas/ChatReasoningStep'
