          - string
          - 'null'
          format: date-time
        next_sync_at:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    SourceAuthorization:
      type: object
      required:
      - id
      - provider
      - mode
      - status
      properties:
        id:
          type: string
        provider:
          $ref: '#/components/schemas/Provider'
        mode:
          $ref: '#/components/schemas/SourceMode'
        status:
          type: string
          enum:
          - pending
          - verified
          - failed
        authorize_url:
          type:
          - string
          - 'null'
