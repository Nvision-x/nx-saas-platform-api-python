components:
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Pagination cursor from a previous response.
      x-go-name: CursorParam
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Retries with the same key within 24 h return the original response.
      schema:
        type: string
        maxLength: 255
    Limit:
      name: limit
      in: query
      description: 1–100. Default 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ProcessAssessmentId:
      name: assessment_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        examples:
        - pas_01k6c1x0d8f9g2h3j4k5m6n7p8
    ProcessEntityId:
      name: entity_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 200
    ProcessPolicyId:
      name: policy_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    ProcessPolicyVersion:
      name: version
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
    WorkspaceHeader:
      name: Nx-Workspace
      in: header
      required: false
      description: Required with session auth on workspace-scoped resources. Ignored with bearer auth (the token's workspace
        applies).
      schema:
        type: string
        examples:
        - ws_acme
  responses:
    BudgetExceeded:
      description: 'The call cannot be paid for: `budget_exceeded` (the token''s spend cap is exhausted), `spend_limit_reached`
        (the organization''s daily spend limit is reached) or `insufficient_balance` (free credit and balance are used up).
        The call did not run and is not billed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            budget_exceeded:
              value:
                error:
                  type: budget_exceeded
                  message: Hard budget reached.
                  budget: staging-search cap
                  limit_usd: 50
                  spent_usd: 50
                  resolve: Raise the limit in Billing → Budgets.
            spend_limit_reached:
              value:
                error:
                  type: spend_limit_reached
                  message: Daily spend limit reached.
                  limit_usd: 100
                  spent_usd: 100.42
                  resolve: Request a limit increase in Billing → Limits.
            insufficient_balance:
              value:
                error:
                  type: insufficient_balance
                  message: The organization balance is used up.
                  balance_usd: -0.37
                  resolve: Add a payment method or top up in Billing → Balance.
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: conflict
              message: A token named prod-ingest-worker already exists.
    Forbidden:
      description: The token lacks the scope or source grant, the user lacks the permission (workspace or organization), or
        the change would grant more than the caller holds (escalation guard).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: insufficient_scope
              message: This token cannot read source src_1.
              required_scope: search:read
    InvalidRequest:
      description: The request is malformed or a field is invalid. `param` names the field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request
              message: Name the token.
              param: name
    NotFound:
      description: The resource does not exist in this workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: not_found
              message: No source src_9 in ws_acme.
    ProcessMapUnavailable:
      description: 'The knowledge hub cannot serve this request now. `reason` says why when known: `entity_index_unavailable`,
        `registry_unavailable`, `document_text_unavailable`, `capacity` (with `Retry-After`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests. Retry after `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Missing, invalid, expired or revoked credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: unauthenticated
              message: The token nx_live_4f9c… was revoked.
    Unprocessable:
      description: The request is well formed but cannot be processed in the current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: unprocessable
              message: No organization uses SAML for acme-health.com.
  schemas:
    AgentRun:
      type: object
      required:
      - run_id
      - status
      - tool_calls
      - cost_usd
      properties:
        run_id:
          type: string
        status:
          type: string
          enum:
          - completed
          - failed
          - stopped
        tool_calls:
          type: integer
        cost_usd:
          type: number
        answer:
          type: string
        citations:
          type: array
          items:
            type: string
          description: Record IDs.
    AgentRunRequest:
      type: object
      required:
      - instructions
      properties:
        instructions:
          type: string
          minLength: 1
        tools:
          type: array
          items:
            $ref: '#/components/schemas/McpToolName'
          description: 'Allowed tools. Default: all permitted.'
        sources:
          type: array
          items:
            type: string
          description: 'Limit to these source IDs. Default: all permitted.'
        max_tool_calls:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    AgentSession:
      type: object
      required:
      - id
      - client
      - credential
      - tool_calls
      - cost_usd
      - started_at
      properties:
        id:
          type: string
        client:
          type: string
          examples:
          - Claude Desktop 1.4
        credential:
          $ref: '#/components/schemas/CredentialRef'
        tool_calls:
          type: integer
        cost_usd:
          type: number
        started_at:
          type: string
          format: date-time
    AgentSessionList:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentSession'
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    AppGrant:
      type: object
      required:
      - id
      - app_id
      - status
      - drives
      - created_at
      properties:
        id:
          type: string
        app_id:
          type: string
          description: The Nx application (Entra client ID).
        status:
          type: string
          enum:
          - pending
          - consented
          - revoked
        consent_url:
          type:
          - string
          - 'null'
          format: uri
          description: Pending grants.
        drives:
          type: integer
          description: Drives synced through this application.
        throttled_until:
          type:
          - string
          - 'null'
          format: date-time
        consented_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    AppGrantList:
      type: object
      required:
      - data
      - recommended
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AppGrant'
        recommended:
          type: integer
          minimum: 1
    Budget:
      type: object
      required:
      - id
      - name
      - scope
      - type
      - limit_usd
      - spent_usd
      - alert_thresholds
      - notify
      - blocking
      - created_at
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          $ref: '#/components/schemas/BudgetScope'
        scope_label:
          type: string
          examples:
          - Meter · Documents ingested
        type:
          type: string
          enum:
          - soft
          - hard
        limit_usd:
          type: number
        spent_usd:
          type: number
        alert_thresholds:
          type: array
          items:
            type: integer
            enum:
            - 50
            - 80
            - 100
        notify:
          type: array
          items:
            type: string
            format: email
        blocking:
          type: boolean
          description: Hard budget at its limit; calls in scope return 402.
        created_at:
          type: string
          format: date-time
    BudgetCreate:
      type: object
      required:
      - scope
      - type
      - limit_usd
      properties:
        name:
          type: string
          description: 'Default: derived from the scope.'
        scope:
          $ref: '#/components/schemas/BudgetScope'
        type:
          type: string
          enum:
          - soft
          - hard
          description: '`hard` only with `token` scope (a spend cap); the organization balance governs everything else.'
        limit_usd:
          type: number
          exclusiveMinimum: 0
        alert_thresholds:
          type: array
          items:
            type: integer
            enum:
            - 50
            - 80
            - 100
          default:
          - 50
          - 80
          - 100
        notify:
          type: array
          items:
            type: string
            format: email
    BudgetList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Budget'
    BudgetScope:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - workspace
          - meter
          - token
        meter:
          $ref: '#/components/schemas/Meter'
        token_id:
          type: string
    BudgetUpdate:
      type: object
      properties:
        name:
          type: string
        limit_usd:
          type: number
          exclusiveMinimum: 0
        alert_thresholds:
          type: array
          items:
            type: integer
            enum:
            - 50
            - 80
            - 100
        notify:
          type: array
          items:
            type: string
            format: email
    ChatCitation:
      type: object
      required:
      - marker
      - record_id
      - title
      - source_id
      - snippet
      description: A record the answer cites; `marker` is the number in its `[n]` markers.
      properties:
        marker:
          type: integer
          minimum: 1
        record_id:
          type: string
        title:
          type: string
        path:
          type: string
          description: Source URI.
        source_id:
          type: string
        record_type:
          type: string
        snippet:
          type: string
          description: The passage the answer relies on.
    ChatConversation:
      type: object
      required:
      - id
      - title
      - sources
      - message_count
      - last_message_preview
      - created_at
      - updated_at
      properties:
        id:
