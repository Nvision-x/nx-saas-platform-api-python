          - string
          - 'null'
    IngestHour:
      type: object
      required:
      - start
      - added
      - parsed
      - searchable
      properties:
        start:
          type: string
          format: date-time
        added:
          type: integer
          description: Documents added in the hour.
        parsed:
          type: integer
          description: Documents the parser read in the hour.
        searchable:
          type: integer
          description: Documents that became searchable in the hour.
    IngestUploadRequest:
      type: object
      required:
      - file
      properties:
        file:
          type: array
          minItems: 1
          maxItems: 100
          description: The files, 1 to 100 per request, up to 2 GB each.
          items:
            type: string
            format: binary
        metadata:
          type: string
          description: 'JSON-encoded object of strings, sent as a multipart part before every

            file part. Ordinary keys are stored with the record. Governing uploads

            require both `governing_doc_type` (an uploadable registry id) and

            `governing_doc_source` (`manual`), or neither. Optional

            `governing_doc_version` is at most 64 characters;

            `governing_doc_effective_from` and `governing_doc_effective_to` are

            valid `YYYY-MM-DD` dates with from no later than to. These optional

            values are recorded as supplied, never as source quotations.

            Governing validation failures return 422; an unavailable registry

            returns 503 with reason `governing_types_unavailable`. Failed uploads

            keep no stored originals. Keys without the `governing_doc_` prefix

            keep their usual meaning.

            '
          example: '{"governing_doc_type":"access_review","governing_doc_source":"manual","governing_doc_version":"2.0","governing_doc_effective_from":"2026-01-01"}'
        classify:
          type: boolean
          default: true
    IngestUrlRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: A URL (typically signed) Nx fetches once.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Stored with the record.
        classify:
          type: boolean
          default: true
    Job:
      type: object
      required:
      - id
      - source
      - documents
      - status
      - progress
      - record_types
      - created_at
      properties:
        id:
          type: string
          examples:
          - job_7Hq2xK
        source:
          type: string
          enum:
          - api
          - upload
          - sharepoint
          - s3
          - gdrive
          - box
        source_id:
          type:
          - string
          - 'null'
        documents:
          type: integer
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Documents ingested (searchable) as a percentage of all of them.
        parsed:
          type: integer
          minimum: 0
          description: Documents the parser has finished with (read, or failed to read). A `running` job with `parsed` below
            `documents` is parsing; one with every document parsed is waiting for the workspace's index to be built.
        record_types:
          type: array
          items:
            type: string
          description: Distinct record types assigned so far.
        estimated_cost_usd:
          type: number
        classified:
          type: array
          description: Per-document classifications, on completed jobs with ≤ 100 documents.
          items:
            $ref: '#/components/schemas/Classification'
        error:
          type:
          - string
          - 'null'
          description: 'What went wrong, in one line: `No document could be ingested.` or `2 of 10 documents could not be
            ingested.`. `failures` says which and why.'
        failures:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/JobFailure'
          description: Up to 20 of the job's documents that failed, with why, oldest first. Empty while none has.
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
    JobFailure:
      type: object
      required:
      - document_id
      - name
      - error
      properties:
        document_id:
          type: string
        name:
          type: string
        error:
          type: string
          description: The document's `ingest_error`.
    JobList:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    JobProgress:
      type: object
      description: Progress of background work on the workspace.
      required:
      - state
      - done
      - total
      - percent
      - eta_seconds
      - started_at
      properties:
        state:
          type: string
          enum:
          - running
          - stalled
          - done
          - failed
          description: '`stalled`: running, but no progress was reported for over 3 minutes.'
        done:
          type: integer
          description: Documents processed so far.
        total:
          type: integer
          description: Documents to process. 0 while not yet known.
        percent:
          type:
          - number
          - 'null'
          description: '`done` / `total` as a percentage (0–100); `null` while `total` is 0.'
          examples:
          - 12.2
        eta_seconds:
          type:
          - integer
          - 'null'
          description: Estimated seconds left while `running`; `null` when it cannot be estimated.
        started_at:
          type: string
          format: date-time
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - paused
      - completed
      - failed
    JobSummary:
      type: object
      required:
      - jobs
      - pending_documents
      - oldest_pending_at
      - hourly
      - indexing
      - search_upgrade
      properties:
        jobs:
          type: object
          required:
          - queued
          - running
          - completed
          - failed
          properties:
            queued:
              type: integer
            running:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
        pending_documents:
          type: integer
          description: Live documents not yet searchable and not failed.
        oldest_pending_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the longest-waiting pending document was added. `null` when none is pending.
        hourly:
          type: array
          description: The last 24 hours, oldest first; the last bucket is the current, partial hour.
          items:
            $ref: '#/components/schemas/IngestHour'
        indexing:
          oneOf:
          - $ref: '#/components/schemas/JobProgress'
          - type: 'null'
          description: The latest update of the workspace's search index. `null` when none is running and none ended in the
            last 24 hours.
        search_upgrade:
          oneOf:
          - $ref: '#/components/schemas/JobProgress'
          - type: 'null'
          description: The latest upgrade of the workspace's search, reported only while it affects search results. `null`
            otherwise, and when none is running and none ended in the last 24 hours.
